name: Dynamic Web Architect CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: dwa-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Test, Validate & Self-Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run test suite
        run: npm test

      - name: Build multi-host targets
        run: npm run build:targets

      - name: Validate root package
        run: npm run validate

      - name: Validate multi-host packages and MCP servers
        run: npm run validate:packages

      - name: Run self-audit
        run: npm run self:audit
